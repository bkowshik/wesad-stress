[project]
name = "wesad-stress"
version = "0.1.0"
description = "Stress detection from wearable physiological signals (WESAD)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.12",
    "mne>=1.12",
    "mlflow>=3.12",
    "pandas>=2.3",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "matplotlib>=3.10",
    "pyarrow>=23.0",
    "ipykernel>=7.2",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wesad_stress"]

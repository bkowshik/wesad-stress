[project]
name = "wesad-stress"
version = "0.1.0"
description = "Stress detection from wearable physiological signals (WESAD)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3",
    "mne>=1.7",
    "mlflow>=2.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wesad_stress"]
